<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="robots" content="noindex">
  <!-- 地圖底圖測試頁:OpenSpec change google-map-tiles 用,App 沒有連結到這裡,正式換進 App 後刪掉 -->
  <title>地圖測試</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
  <style>
    :root {
      --bg: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --border: #d1d5db;
      --btn-bg: #f3f4f6;
      --active-bg: #0a4269;
      --active-text: #ffffff;
    }

    body.dark {
      --bg: #111827;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: #374151;
      --btn-bg: #1f2937;
      --active-bg: #3b82f6;
    }

    html, body {
      margin: 0;
      height: 100%;
    }

    body {
      display: flex;
      flex-direction: column;
      height: 100dvh;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Noto Sans TC", sans-serif;
      font-size: 14px;
    }

    #panel {
      padding: calc(8px + env(safe-area-inset-top, 0px)) 12px 8px;
      border-bottom: 1px solid var(--border);
    }

    .row {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 6px;
    }

    .row-label {
      width: 2.5em;
      color: var(--muted);
      flex-shrink: 0;
    }

    .row button {
      flex: 1;
      min-height: 36px;
      border: 1px solid var(--border);
      border-radius: 8px;
      background: var(--btn-bg);
      color: var(--text);
      font-size: 14px;
      -webkit-tap-highlight-color: transparent;
    }

    .row button.active {
      background: var(--active-bg);
      border-color: var(--active-bg);
      color: var(--active-text);
      font-weight: bold;
    }

    /* 看現在的地圖時,地名、字的大小用不到 */
    .row.dim {
      opacity: 0.4;
    }

    details {
      font-size: 13px;
    }

    summary {
      color: var(--muted);
      padding: 4px 0;
    }

    #diag {
      margin: 4px 0 0;
      padding-left: 1.2em;
      line-height: 1.6;
      word-break: break-all;
    }

    #map {
      flex: 1;
      min-height: 0;
    }

    /* Google logo:高度 18px,四周留白照 Google 規定 (左右上 10px、下 5px) */
    .leaflet-control.google-logo {
      display: block;
      height: 18px;
      width: auto;
      margin: 10px 10px 5px 10px;
    }

    .leaflet-control.google-logo[hidden] {
      display: none;
    }

    /* 現在的地圖 (OpenStreetMap) 在深色主題時,跟 App 一樣用反轉顏色 */
    body.dark.osm .leaflet-tile-pane {
      filter: invert(1) hue-rotate(180deg) brightness(0.95) contrast(0.9) saturate(0.6);
    }
  </style>
</head>
<body>
  <header id="panel">
    <div class="row">
      <span class="row-label">底圖</span>
      <button type="button" data-key="base" data-value="google">Google</button>
      <button type="button" data-key="base" data-value="osm">現在的地圖</button>
    </div>
    <div class="row google-only">
      <span class="row-label">地名</span>
      <button type="button" data-key="lang" data-value="ja">日文</button>
      <button type="button" data-key="lang" data-value="en">英日並列</button>
    </div>
    <div class="row google-only">
      <span class="row-label">字</span>
      <button type="button" data-key="size" data-value="normal">一般</button>
      <button type="button" data-key="size" data-value="large">兩倍字</button>
    </div>
    <div class="row">
      <span class="row-label">主題</span>
      <button type="button" data-key="theme" data-value="light">淺色</button>
      <button type="button" data-key="theme" data-value="dark">深色</button>
    </div>
    <details>
      <summary>診斷資訊（有問題時截圖給 Claude）</summary>
      <ul id="diag"></ul>
    </details>
  </header>

  <div id="map"></div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="data.js"></script>
  <script src="map-test.js"></script>
</body>
</html>
